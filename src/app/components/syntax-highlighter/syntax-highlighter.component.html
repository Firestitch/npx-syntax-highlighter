@if (label() || copyable()) {
  <div class="fs-syntax-highlighter-header">
    <span class="fs-syntax-highlighter-language">{{ label() }}</span>
    @if (copyable()) {
      <button
        type="button"
        class="fs-syntax-highlighter-copy"
        title="Copy code"
        (click)="copy()">
        <svg viewBox="0 0 24 24" aria-hidden="true">
          <path d="M16 1H4a2 2 0 0 0-2 2v14h2V3h12V1zm3 4H8a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h11a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2zm0 16H8V7h11v14z"></path>
        </svg>
      </button>
    }
  </div>
}

<!--
  Two branches, not one, so the block is readable before its grammar chunk arrives: `html()` is null
  until then and the raw source is interpolated instead, which Angular escapes for us. Once
  highlighting lands, the markup is bound with [innerHTML] — highlight.js emits only <span class>,
  and escapes its input by construction, so nothing here can turn source into markup.
-->
@if (html(); as markup) {
  <pre><code class="hljs" [innerHTML]="markup"></code></pre>
} @else {
  <pre><code class="hljs">{{ code() }}</code></pre>
}
